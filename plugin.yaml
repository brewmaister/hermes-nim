name: hermes-nim
version: "0.0.35.2"
manifest_version: 2
api_version: 1
description: "NVIDIA NIM model health in chat: /nim reports which NIM models are alive, stalled, retired or newly arrived, because NVIDIA publishes none of it. `hermes nim` is the same engine for scripts and cron."
author: brewmaister
license: MIT
homepage: https://github.com/brewmaister/hermes-nim
tags: [nvidia, nim, models, health, watchdog]
requires_hermes: ">=0.21.6"
provides_hooks: []
provides_locales: [en, es]
locale_metadata:
  en: {endonym: English}
  es: {endonym: Español}
config_schema:
  api_base:
    type: string
    default: "https://integrate.api.nvidia.com/v1"
    description: "OpenAI-compatible NIM base URL. Override only for a self-hosted or proxied gateway."
  ttft_seconds:
    type: number
    default: 25
    description: "Seconds to first byte before a model counts as stalled. NIM cold starts run 15-20s, so do not lower this below 20."
  attempts:
    type: number
    default: 2
    description: "Calls per model. One call lies: a half-broken model behind the NIM gateway stalls roughly half the time, so a single stall proves nothing. 2-3 is the useful range."
  stagger_seconds:
    type: number
    default: 1.5
    description: "Pause between attempts on the same model."
  state_dir:
    type: string
    default: ""
    description: "Where state.json and per-run artifacts live. Empty means ~/hermes-outputs/nim-probe. Set the same path in every profile that shares an NVIDIA key, or each profile will think it discovered every model."
  live_default:
    type: boolean
    default: true
    description: "Whether /nim measures live on every call. On: the default view is realtime (~15-40 s). Off: it renders the last scan, and /nim live probes. /nim cached is always instant."
  live_grace_seconds:
    type: number
    default: 20
    description: "Reuse a scan younger than this instead of probing again, so a double-tap does not fire two full probes."
  survey_catalog:
    type: boolean
    default: true
    description: "Every `/nim` surveys the whole catalog — every id NVIDIA lists, measured once, sorted into chat / utility / offline. Costs ~17 s instead of ~1 s. Set false to go back to checking only the models your config uses."
  survey_ttft_seconds:
    type: number
    default: 10
    description: "First-byte cap during a catalog survey. A sweep at the fallback cap would take an hour; 10 s is enough to separate answering from not."
  survey_workers:
    type: number
    default: 20
    description: "Parallel probes during a catalog survey. 85 models at 10 took 32 s because eight stalled models hogged the pool; 20 workers gives ~12 s with one rate-limit hit across the catalog."
  recheck_ttft_seconds:
    type: number
    default: 8
    description: "First-byte cap for a model already confirmed dead (0 disables). Re-confirming a death is a cheaper question than the first verdict: 25 s of silence per dead model per sweep bought nothing. 8 s is still far above the 5 s recommendation gate, so a slow recovery is not mistaken for a usable one."
  live_attempts:
    type: number
    default: 1
    description: "Attempts per model for the interactive /nim (one keeps the worst case at a single stall cap; /nim probe still uses `attempts`). Hysteresis still needs two consecutive runs before anything is called dead, so a single sample cannot fake a death."
  recommend_max_ttft_s:
    type: number
    default: 5
    description: "The star's speed gate: a model that takes longer than this for a first byte is not recommended for chat, however good its score."
  recommend_min_tps:
    type: number
    default: 25
    description: "A scored model must write at least this many tokens/second to keep the star's top tier; below it, quality still counts but ranks behind a model that is both scored and quick."
  scores_refresh:
    type: boolean
    default: true
    description: "A survey re-reads the Hermes Index (portal.nousresearch.com/bench, cached to disk) when the cache is stale. The quality prior is fetched, never typed."
  scores_max_age_hours:
    type: number
    default: 24
    description: "How old the cached Hermes Index may get before a survey re-reads it."
  language:
    type: string
    default: "auto"
    description: "Output language: auto (follows NIM_LANGUAGE → HERMES_LANGUAGE → display.language), or pin en / es. Adding a language is one YAML file in locales/."
  shortlist:
    type: string
    default: ""
    description: "Comma-separated extra models to probe alongside the ones your config uses — the candidate pool for swaps. Empty by default: nothing is probed that you did not point at, so `/nim` measures exactly what config.yaml references."
