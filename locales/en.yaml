  stats: "⌛️{age} · 🗒{listed} listed · 🟢 {chat} chat · 🛠 {utility} · 🔴 {offline} offline"
  section_chat: "💬 chat models"
  section_utility: "🛠 utility models"
  pick_unconfigured: "not in config — add it to use it"
